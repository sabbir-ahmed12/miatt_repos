[workspace]
name = "register-circles"
version = "0.1.0"
description = "ITK-based 2D circle registration — ECE 5940 Lab 03"
authors = ["Sabbir Ahmed <sabbir.ahmed845@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
cmake        = ">=3.20"
ninja        = ">=1.11"
cxx-compiler = ">=1.0"
libitk-devel = ">=5.4"

[tasks]
configure = "cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release"
build     = { cmd = "cmake --build build", depends-on = ["configure"] }
generate  = { cmd = "./build/generate_images img1.png img2.png", depends-on = ["build"] }
register  = { cmd = "./build/register_circles img1.png img2.png", depends-on = ["generate"] }
test      = { cmd = "ctest --test-dir build --output-on-failure", depends-on = ["build"] }
clean     = "rm -rf build build-debug img1.png img2.png"
